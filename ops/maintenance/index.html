<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170b24" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="15" />
    <title>Gobble · Maintenance en cours</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #12091e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(20px, env(safe-area-inset-top)) 18px
          max(20px, env(safe-area-inset-bottom));
        color: #fff8e8;
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 194, 82, 0.22), transparent 31%),
          radial-gradient(circle at 15% 82%, rgba(126, 64, 190, 0.28), transparent 34%),
          linear-gradient(155deg, #251238 0%, #12091e 48%, #08040e 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        background-image: linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      main {
        position: relative;
        width: min(100%, 680px);
        padding: clamp(28px, 6vw, 52px);
        overflow: hidden;
        border: 1px solid rgba(255, 221, 154, 0.32);
        border-radius: 28px;
        text-align: center;
        background: linear-gradient(145deg, rgba(43, 24, 59, 0.96), rgba(17, 9, 28, 0.96));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.52), inset 0 1px rgba(255, 255, 255, 0.12);
      }

      main::after {
        content: "";
        position: absolute;
        inset: -45% 30% 58% -20%;
        transform: rotate(-12deg);
        background: linear-gradient(90deg, transparent, rgba(255, 226, 162, 0.12), transparent);
        animation: shimmer 4.5s ease-in-out infinite;
        pointer-events: none;
      }

      .brand {
        margin: 0 0 28px;
        color: #ffd77c;
        font-size: clamp(34px, 9vw, 62px);
        font-weight: 1000;
        letter-spacing: 0.12em;
        line-height: 1;
        text-indent: 0.12em;
        text-shadow: 0 4px 0 #7e3214, 0 9px 24px rgba(255, 172, 58, 0.28);
      }

      .tiles {
        display: flex;
        justify-content: center;
        gap: clamp(5px, 1.7vw, 10px);
        margin-bottom: 30px;
      }

      .tile {
        width: clamp(36px, 10vw, 58px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 1px solid rgba(112, 53, 14, 0.62);
        border-radius: 12px;
        color: #4d250d;
        font-size: clamp(20px, 5.5vw, 32px);
        font-weight: 1000;
        background: linear-gradient(145deg, #fff2bd, #efbd62 72%, #c47a2d);
        box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.62),
          inset -3px -4px 7px rgba(106, 45, 8, 0.24), 0 9px 16px rgba(0, 0, 0, 0.28);
        animation: tile-breathe 2.4s ease-in-out infinite;
      }

      .tile:nth-child(2) { animation-delay: 0.12s; }
      .tile:nth-child(3) { animation-delay: 0.24s; }
      .tile:nth-child(4) { animation-delay: 0.36s; }
      .tile:nth-child(5) { animation-delay: 0.48s; }
      .tile:nth-child(6) { animation-delay: 0.6s; }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
        padding: 8px 13px;
        border: 1px solid rgba(255, 119, 119, 0.42);
        border-radius: 999px;
        color: #ffd8d8;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(173, 26, 43, 0.28);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff6868;
        box-shadow: 0 0 0 0 rgba(255, 104, 104, 0.72);
        animation: pulse 1.7s ease-out infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 40px);
        line-height: 1.1;
      }

      p {
        max-width: 500px;
        margin: 16px auto 0;
        color: rgba(255, 248, 232, 0.76);
        font-size: clamp(15px, 3vw, 18px);
        font-weight: 650;
        line-height: 1.55;
      }

      .retry {
        margin-top: 28px;
        color: rgba(255, 225, 164, 0.72);
        font-size: 12px;
        font-weight: 750;
      }

      @keyframes tile-breathe {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-5px) rotate(1deg); }
      }

      @keyframes pulse {
        70% { box-shadow: 0 0 0 9px rgba(255, 104, 104, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 104, 104, 0); }
      }

      @keyframes shimmer {
        0%, 30% { transform: translateX(-80%) rotate(-12deg); }
        75%, 100% { transform: translateX(190%) rotate(-12deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">GOBBLE</div>
      <div class="tiles" aria-hidden="true">
        <span class="tile">G</span>
        <span class="tile">O</span>
        <span class="tile">B</span>
        <span class="tile">B</span>
        <span class="tile">L</span>
        <span class="tile">E</span>
      </div>
      <div class="status"><span class="status-dot"></span> Maintenance en cours</div>
      <h1>Le jeu revient très vite</h1>
      <p>
        Gobble se refait une beauté. La partie reprendra dès que la mise à jour sera terminée.
      </p>
      <div class="retry" aria-live="polite">
        Nouvelle tentative automatique dans <span id="retry-seconds">12</span> s
      </div>
    </main>
    <script>
      (() => {
        let seconds = 12;
        const label = document.getElementById("retry-seconds");
        window.setInterval(() => {
          seconds -= 1;
          if (seconds <= 0) {
            window.location.reload();
            return;
          }
          if (label) label.textContent = String(seconds);
        }, 1000);
      })();
    </script>
  </body>
</html>
